name: Broadband Access
description: 'Broadband Access Systems, Inc. was a Westborough, Massachusetts networking
  company founded in 1998 that built a next-generation Internet Protocol (IP) broadband
  access platform — a carrier-class cable-modem termination system (CMTS) that let
  cable operators and communications service providers deliver data, voice and video
  services over hybrid fiber-coax networks at scale. Matrix Partners was one of eight
  venture investors in the company alongside North Bridge Venture Partners, Norwest,
  Blueprint Ventures and Bowman Capital Management. ADC Telecommunications agreed on
  September 20, 2000 to acquire Broadband Access Systems for approximately $2.25 billion
  in ADC common stock, and the acquisition closed on October 2, 2000. The company was
  absorbed into ADC''s cable and broadband business, which ADC later divested; ADC itself
  was acquired by TE Connectivity in 2010. Broadband Access Systems operated no public
  developer program and shipped hardware platforms rather than APIs; it has had no
  independent web, documentation, or API surface since 2000. This profile is retained
  in the API Evangelist network as a historical venture-portfolio record only.'
